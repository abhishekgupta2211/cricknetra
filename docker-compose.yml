# CricNetra — local/production-like stack: Postgres + the API (which also serves
# the SPA and marketing site).
#
#   docker compose up --build
#   open http://localhost:8000/        (marketing)   /app (scoring)   /docs (API)
#
# Compose reads ./.env for the ${...} values below (see .env.example). The app's
# own CRICNETRA_* settings are passed explicitly in the `app` service so the
# image needs no .env baked in.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-CricNetra_db}
    volumes:
      - cricnetra_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-CricNetra_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Connect to the `db` service (psycopg driver). Override via .env if needed.
      CRICNETRA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-CricNetra_db}
      # CHANGE THIS in production (set CRICNETRA_SECRET_KEY in .env).
      CRICNETRA_SECRET_KEY: ${CRICNETRA_SECRET_KEY:-dev-insecure-secret-change-me-in-production}
      # Dev delivery returns OTP/reset codes in API responses — turn OFF once a
      # real SMS/email sender is wired up.
      CRICNETRA_AUTH_DEV_DELIVERY: ${CRICNETRA_AUTH_DEV_DELIVERY:-true}
      # Email (OTP + password reset). Leave SMTP_HOST empty to log codes to the
      # console instead of sending. Fill these from .env for a real provider.
      CRICNETRA_SMTP_HOST: ${CRICNETRA_SMTP_HOST:-}
      CRICNETRA_SMTP_PORT: ${CRICNETRA_SMTP_PORT:-587}
      CRICNETRA_SMTP_USER: ${CRICNETRA_SMTP_USER:-}
      CRICNETRA_SMTP_PASSWORD: ${CRICNETRA_SMTP_PASSWORD:-}
      CRICNETRA_SMTP_FROM: ${CRICNETRA_SMTP_FROM:-}
      CRICNETRA_SMTP_STARTTLS: ${CRICNETRA_SMTP_STARTTLS:-true}
      # Structured one-line-JSON logs for aggregators (Loki/CloudWatch/etc.).
      CRICNETRA_LOG_FORMAT: ${CRICNETRA_LOG_FORMAT:-json}
      CRICNETRA_LOG_LEVEL: ${CRICNETRA_LOG_LEVEL:-INFO}
      # Uploaded recordings + auto-cut highlight clips live here (a persistent
      # volume). ffmpeg is baked into the image; auto-clipping is off if absent.
      CRICNETRA_MEDIA_DIR: ${CRICNETRA_MEDIA_DIR:-/srv/media}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - cricnetra_media:/srv/media
    restart: unless-stopped

volumes:
  cricnetra_pgdata:
  cricnetra_media:
